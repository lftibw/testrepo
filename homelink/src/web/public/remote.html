<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLink Remote</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c1e21; --muted: #65707d;
    --accent: #0a84ff; --ok: #30a46c; --err: #d92d20; --border: #e3e6ea; --track: #e3e6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101214; --card: #1a1d21; --text: #e8eaed; --muted: #98a1ab;
      --accent: #409cff; --ok: #3dd68c; --err: #ff6b5e; --border: #2a2f35; --track: #2a2f35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 24px 20px 6px; max-width: 1040px; margin: 0 auto; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { color: var(--muted); margin: 6px 0 0; }
  .navlink {
    font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 12px 20px 60px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .dev {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .dev.off { opacity: .82; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .nm { font-weight: 650; font-size: 16px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sub .acct { color: var(--accent); }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .offline { color: var(--err); }
  .pow {
    flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); font-size: 20px; cursor: pointer; transition: .15s;
  }
  .pow.on { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(48,164,108,.4); }
  .ctl { display: flex; flex-direction: column; gap: 7px; }
  .ctl .lbl { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
  .ctl .lbl b { color: var(--text); font-weight: 600; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px;
    background: var(--track); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0,0,0,.15); box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.15); cursor: pointer;
  }
  .ct-slider { background: linear-gradient(90deg, #ffb763, #fff5e8 45%, #eaf3ff 70%, #bcd8ff); }
  .colorrow { display: flex; align-items: center; justify-content: space-between; }
  input[type=color] {
    -webkit-appearance: none; appearance: none; width: 46px; height: 30px; border: 1px solid var(--border);
    border-radius: 8px; background: none; cursor: pointer; padding: 0;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  .modes button {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .modes button.active { background: var(--accent); color: #fff; border-color: transparent; }
  .temp { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .temp button {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 22px; cursor: pointer;
  }
  .tempval { text-align: center; min-width: 84px; }
  .tempval .t { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tempval .cur { font-size: 12px; color: var(--muted); }
  .plain { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--err); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="nav">
    <h1>🎛 HomeLink Remote</h1>
    <a class="navlink" href="/">← Setup</a>
  </div>
  <p>Control your SmartThings & Wipro devices from here — changes sync to Apple Home too.</p>
</header>
<main>
  <div class="grid" id="grid"><div class="empty">Loading devices…</div></div>
</main>
<div class="toast" id="toast"></div>
<script src="remote.js"></script>
</body>
</html>
